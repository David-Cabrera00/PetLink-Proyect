services:
  postgres:
    image: postgres:16-alpine
    container_name: petlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petlink
      POSTGRES_PASSWORD: petlink_local_dev
      POSTGRES_DB: petlink
    ports:
      - "5433:5432"
    volumes:
      - petlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petlink -d petlink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petlink_postgres_data:
